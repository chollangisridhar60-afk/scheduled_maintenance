name: Terraform

on:
  workflow_dispatch:
    inputs:
      target_tags:
        description: "Target tags as key=value1 ; key2=value (e.g. env=dev;name=test)"
        required: true
        type: string
      window_name:
        description: "Maintenance window name (e.g. CVE-2026-114938). Letters, digits, . _ - only"
        required: true
        default: "CVE-2026-114938"
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: choice
        options:
          - us-east-1 # N. Virginia
          - us-east-2 # Ohio
          - us-west-1 # N. California
          - us-west-2 # Oregon
      schedule:
        description: "Cron/rate/at expression (e.g. cron(43 05 ? * FRI#1 *) or at(2026-12-04T05:43:00))"
        required: true
        type: string

      advisory_id:
        description: "Amazon Linux advisory (e.g. ALAS2023-2026-3478 or ALAS2-2026-4123)"
        required: true
        type: string
      releasever:
        description: "AL2023 --releasever (e.g. 2023.12.20261117, or latest). Ignored on AL2"
        required: true
        type: string
      packages:
        description: "Package names, comma-separated (e.g. java-17-amazon-corretto)"
        required: true
        type: string
      restart_services:
        description: "Auto-restart only services still running replaced files of the patched packages (untick to never restart)"
        required: true
        type: boolean

permissions:
  id-token: write # OIDC to AWS
  contents: read

env:
  TF_IN_AUTOMATION: "true"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.x

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve parameters
        env:
          TARGET_TAGS: ${{ inputs.target_tags }}
          REGION: ${{ inputs.aws_region }}
          SCHEDULE: ${{ inputs.schedule }}
          WINDOW_NAME: ${{ inputs.window_name }}
          ADVISORY_ID: ${{ inputs.advisory_id }}
          RELEASEVER: ${{ inputs.releasever }}
          PACKAGES: ${{ inputs.packages }}
          RESTART_SERVICES: ${{ inputs.restart_services }}
        run: |
          trim() { printf '%s' "$1" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//'; }
          SCHEDULE=$(trim "$SCHEDULE"); ADVISORY_ID=$(trim "$ADVISORY_ID"); RELEASEVER=$(trim "$RELEASEVER"); WINDOW_NAME=$(trim "$WINDOW_NAME")
          PACKAGES_JSON=$(printf '%s' "$PACKAGES" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')
          case "$TARGET_TAGS" in
            "{"*) ;;
            *=*) ;;
            *) echo "::error::target_tags must look like 'key=value1,value2;key2=value' (or a JSON object)"; exit 1 ;;
          esac
          TAGS_JSON=$(printf '%s' "$TARGET_TAGS" | jq -Rc 'if startswith("{") then fromjson else split(";") | map(select(length>0)) | map(split("=")) | map({key:(.[0]|gsub("^\\s+|\\s+$";"")), value:((.[1] // "")|split(",")|map(gsub("^\\s+|\\s+$";""))|map(select(length>0)))}) | from_entries end')
          echo "TF_VAR_region=$REGION" >> "$GITHUB_ENV"
          echo "TF_VAR_schedule=$SCHEDULE" >> "$GITHUB_ENV"
          echo "TF_VAR_name=$WINDOW_NAME" >> "$GITHUB_ENV"
          echo "TF_VAR_advisory_id=$ADVISORY_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_releasever=$RELEASEVER" >> "$GITHUB_ENV"
          echo "TF_VAR_patch_packages=$PACKAGES_JSON" >> "$GITHUB_ENV"
          echo "TF_VAR_restart_services=$RESTART_SERVICES" >> "$GITHUB_ENV"
          echo "TF_VAR_target_tags=$TAGS_JSON" >> "$GITHUB_ENV"
          echo "Window ${WINDOW_NAME}: targeting ${TAGS_JSON} in ${REGION}, schedule ${SCHEDULE}, patching ${ADVISORY_ID} (${RELEASEVER}) on ${PACKAGES_JSON}, restart services: ${RESTART_SERVICES}" >> "$GITHUB_STEP_SUMMARY"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Create an environment named "production" with required reviewers
    # (Settings > Environments) so apply waits for manual approval.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.x

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
